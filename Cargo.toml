[package]
name = "claude-code-usage-monitor"
version = "3.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Usage monitor daemon for Claude Code, Codex, Cursor, OpenCode Go and Grok on Linux, with a GNOME Shell panel extension"
repository = "https://github.com/pieterhelsen/Claude-Code-Usage-Monitor-for-Linux"

[dependencies]
# rustls with the platform verifier reads the system CA store without linking
# OpenSSL, so one binary works across distributions.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
