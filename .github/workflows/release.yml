name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          extension_version=$(sed -n 's/.*"version-name": "\(.*\)".*/\1/p' gnome-extension/metadata.json)
          echo "tag=$tag cargo=$cargo_version extension=$extension_version"
          [ "$tag" = "$cargo_version" ] && [ "$tag" = "$extension_version" ]
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
      - run: cargo build --release --locked
      - name: Package
        run: |
          stage=dist/claude-code-usage-monitor
          mkdir -p "$stage"
          cp target/release/claude-code-usage-monitor "$stage/"
          cp packaging/*.in LICENSE README.md "$stage/"
          packaging/build-extension-zip.sh "$stage/gnome-extension.zip"
          tar -C dist -czf "dist/claude-code-usage-monitor-linux-${{ matrix.arch }}.tar.gz" claude-code-usage-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/claude-code-usage-monitor-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the extension zip and checksums
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
          packaging/build-extension-zip.sh dist/gnome-extension.zip
          cp packaging/install.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
